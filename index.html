<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎁 Gift For Madina</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Фон -->
    <canvas id="canvas"></canvas>

    <!-- Экран приветствия -->
    <div id="intro">

        <h1>A little surprise is waiting for you...</h1>

        <button id="continueBtn">
            Continue →
        </button>

    </div>

    <!-- Экран с подарком -->
    <div id="giftScreen">

        <div class="gift-container" id="giftBox">

    <div class="box">

        <div class="lid"></div>

        <div class="box-body">
            🎁
        </div>

    </div>

</div>

        <p class="tapText">
            🎁 Tap the gift
        </p>

    </div>

    <!-- Финальный экран -->
    <div id="result">

        <img
            id="giftImage"
            src="assets/gift.png"
            alt="Gift">

        <h2>For Madina </h2>

        <p id="message">
            You deserve all the happiness in the world.
        </p>

    </div>

    <!-- Музыка -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
